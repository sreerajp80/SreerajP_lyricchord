name: lyricchord
description: "A lyrics & chords notebook for musicians"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.7.0+38

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3 # same range flutter_localizations requires

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.3.2
  drift: ^2.34.2
  sqlite3_flutter_libs: ^0.6.0+eol
  # Local SQLite bindings only — no network. Already pulled in by drift; named
  # here because `lib/data/app_database.dart` types the connection `setup`
  # callback with it, and the migration test builds an old-schema file with it.
  sqlite3: ^3.4.0
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.5
  go_router: ^18.1.1
  pdf: ^3.12.0
  printing: ^5.14.3
  file_picker: ^13.1.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.2
  wakelock_plus: ^1.3.3
  audioplayers: ^6.1.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.4
  image_picker: ^1.1.2
  local_auth: ^3.0.0
  # Material widgets, moved out of the Flutter SDK (engineering standard 6.1).
  material_ui: ^1.8.0
  # Only for its localization delegate: the Sanskrit fallback in
  # lib/l10n/fallback_localizations.dart (engineering standard 8.3.1).
  cupertino_ui: ^1.1.4
  # Levelled logging behind AppLogger (engineering standard 14). Console only;
  # no network code. Its file outputs are not used.
  logger: ^2.8.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  # Build-time only: generates the platform launcher icons from the master
  # PNGs in assets/icon/. Not shipped in the app; no runtime/network impact.
  flutter_launcher_icons: ^0.14.4

# Launcher-icon generation. Source art is produced by tool/generate_icon.py.
# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24
  remove_alpha_ios: true
  adaptive_icon_background: "#4F378B"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true

  assets:
    - assets/config/
    # Bundled lyric fonts. Listed here (as assets) so the PDF export can load
    # the .ttf bytes through rootBundle, and declared again under `fonts:` below
    # so the on-screen lyric text can use them by family name.
    - assets/fonts/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Bundled lyric fonts. All are open licence (SIL OFL) and use modern
  # (reformed) Malayalam glyphs. The user picks one in Settings -> Fonts; the
  # choice drives the lyric text on screen and in the exported PDF.
  fonts:
    - family: Noto Sans Malayalam
      fonts:
        - asset: assets/fonts/NotoSansMalayalam-Regular.ttf
        - asset: assets/fonts/NotoSansMalayalam-Bold.ttf
          weight: 700
    - family: Noto Serif Malayalam
      fonts:
        - asset: assets/fonts/NotoSerifMalayalam-Regular.ttf
        - asset: assets/fonts/NotoSerifMalayalam-Bold.ttf
          weight: 700
    - family: Manjari
      fonts:
        - asset: assets/fonts/Manjari-Regular.ttf
        - asset: assets/fonts/Manjari-Bold.ttf
          weight: 700
    - family: Gayathri
      fonts:
        - asset: assets/fonts/Gayathri-Regular.ttf
        - asset: assets/fonts/Gayathri-Bold.ttf
          weight: 700
    # Devanagari for the Sanskrit UI (engineering standard 8.3.3, language
    # pack 2). SIL OFL; subset to the Devanagari blocks, shaping kept. Used
    # through the theme's fontFamilyFallback, not picked as a lyric font.
    - family: Noto Sans Devanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
