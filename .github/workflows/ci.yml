# Checks only (engineering standard §19). This workflow never builds release
# artifacts, signs anything, holds secrets, uploads, or publishes. Release
# builds are made locally (docs/release_process.md).
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7          # Dependabot keeps action versions current
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6          # keep equal to the version in CLAUDE.md / AGENTS.md
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # Generated files are committed (README "Generated files"). Fail if the
      # drift or localization output is stale.
      - run: git diff --exit-code -- lib/data/app_database.g.dart lib/l10n/
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      # Language pack gate: no Hindi markers in Sanskrit text.
      - run: bash tool/check_sanskrit_hindi_markers.sh
