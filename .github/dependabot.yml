# Dependency update pull requests (engineering standard §19.2). Every update
# still follows plan -> approve -> log before it is merged, and must keep the
# app fully offline (docs/dependencies.md).
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
